# Local development database only. Render provides the hosted one.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tpay
      POSTGRES_PASSWORD: tpay
      POSTGRES_DB: tpay
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tpay']
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - tpay-postgres:/var/lib/postgresql/data

volumes:
  tpay-postgres: