<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose language</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 24px; background: #F2F3EE; color: #14172B; font-family: 'Noto Sans', sans-serif; display: flex; flex-direction: column; gap: 24px">
  <div style="font-size: 28px; font-weight: 800; line-height: 1.2">Choose your language</div>
  <div style="display: flex; flex-direction: column; gap: 10px; flex-grow: 1">
    <sc-for list="{{langs}}" as="l" hint-placeholder-count="5">
      <div style="display: flex; gap: 8px">
        <a href="Role.dc.html" style="flex-grow: 1; height: 72px; box-sizing: border-box; display: flex; align-items: center; padding: 0 20px; border-radius: 12px; background: {{l.bg}}; color: {{l.fg}}; font-size: 22px; font-weight: 700; text-decoration: none">{{l.name}}</a>
        <button aria-label="Hear {{l.name}}" style="width: 72px; height: 72px; flex: none; border: 0; border-radius: 12px; background: #E7E8F7; color: #2A2F8F; display: flex; align-items: center; justify-content: center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"></path></svg>
        </button>
      </div>
    </sc-for>
  </div>
  <div style="display: flex; justify-content: center; gap: 8px" aria-label="Step 1 of 3">
    <div style="width: 32px; height: 6px; border-radius: 3px; background: #2A2F8F"></div>
    <div style="width: 32px; height: 6px; border-radius: 3px; background: #C9CBC2"></div>
    <div style="width: 32px; height: 6px; border-radius: 3px; background: #C9CBC2"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const on = { bg: '#2A2F8F', fg: '#FFFFFF' }, off = { bg: '#FFFFFF', fg: '#14172B' };
    return { langs: [
      { name: 'English', ...on }, { name: 'Pidgin', ...off }, { name: 'Yorùbá', ...off }, { name: 'Igbo', ...off }, { name: 'Hausa', ...off }
    ] };
  }
}
</script>
</body>
</html>
