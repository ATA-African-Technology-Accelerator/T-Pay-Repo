<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contract error copy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1040px; height: 900px; box-sizing: border-box; padding: 48px 56px; background: #FFFFFF; color: #14172B; font-family: 'Noto Sans', sans-serif; display: flex; flex-direction: column; gap: 20px">
  <div style="font-size: 28px; font-weight: 800">What a person sees for each contract error</div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="16">
      <div style="display: flex; flex-direction: column; gap: 2px; padding: 11px 0; border-bottom: 1px solid #E1E2DA">
        <div style="font-family: 'Noto Sans Mono', monospace; font-size: 13px; font-weight: 500; color: #4A4F66">{{r.code}}</div>
        <div style="font-size: 16px; font-weight: 700">{{r.say}}</div>
        <div style="font-size: 14px; color: #4A4F66">{{r.does}}</div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1040,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { rows: [
      { code: 'VALIDATION_FAILED', say: 'Check this amount', does: 'Inline, on the field. A bug if the UI allowed it.' },
      { code: 'UNAUTHENTICATED', say: 'No message', does: 'Re-register silently, repeat the action once.' },
      { code: 'FORBIDDEN_ROLE', say: 'No message', does: 'Action is hidden for this role. A bug if reached.' },
      { code: 'DEVICE_REVOKED', say: 'This phone must be set up again', does: 'Full screen. Signing stops, button opens ACT-02.' },
      { code: 'VAULT_NOT_FOUND', say: 'No message', does: 'Home refreshes.' },
      { code: 'VOUCHER_NOT_FOUND', say: 'Pending', does: 'Keep the local record, show Pending.' },
      { code: 'ACTIVE_VAULT_EXISTS', say: 'You already have a vault', does: 'Opens the existing vault.' },
      { code: 'ORDER_NOT_APPROVED', say: 'PayPal has not approved this yet', does: 'Button: Return to PayPal.' },
      { code: 'NOT_A_PARTY', say: 'No message', does: 'Stop retrying, log it.' },
      { code: 'INVALID_SIGNATURE', say: 'Refused: this voucher is not valid', does: 'Ticket shows Refused. Stop retrying.' },
      { code: 'INVALID_CERTIFICATE', say: 'Refused: this phone could not be trusted', does: 'Ticket shows Refused. Stop retrying.' },
      { code: 'VOUCHER_EXPIRED', say: 'Blocked: this voucher ran out of time', does: 'Ticket shows Blocked. Stop retrying.' },
      { code: 'INSUFFICIENT_BALANCE', say: 'You can withdraw up to $1.33', does: 'Inline, stating the available balance.' },
      { code: 'RATE_LIMITED', say: 'No message', does: 'Retry with backoff in the background.' },
      { code: 'PAYPAL_UNAVAILABLE', say: 'PayPal is not responding', does: 'Button: Try again. Local data kept.' },
      { code: 'AI_UNAVAILABLE', say: 'Offline assistance', does: 'Opens the offline assistant path, labelled.' }
    ] };
  }
}
</script>
</body>
</html>
