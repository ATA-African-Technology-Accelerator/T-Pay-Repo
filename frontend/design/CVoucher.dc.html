<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Show voucher</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 44px 16px 24px; background: #FFFFFF; color: #14172B; font-family: 'Noto Sans', sans-serif; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 8px">
    <div style="font-size: 17px; font-weight: 700; color: #2A2F8F">Step 2 of 3: seller scans this voucher</div>
    <div style="font-size: 56px; font-weight: 800; line-height: 1.15; letter-spacing: -1px">₦2,000</div>
  </div>
  <div style="align-self: center"><dc-import name="QR" hint-size="326px,326px"></dc-import></div>
  <div style="display: flex; align-items: center; justify-content: center; gap: 10px; flex-grow: 1">
    <div style="width: 24px; height: 24px; flex: none; border-radius: 12px; border: 3px dashed #4A4F66; box-sizing: border-box"></div>
    <div style="font-size: 17px; font-weight: 700">Sent, not yet confirmed</div>
  </div>
  <button style="height: 56px; flex: none; border: 2px solid #2A2F8F; border-radius: 12px; background: transparent; color: #2A2F8F; font-family: inherit; font-size: 18px; font-weight: 700">Copy code instead</button>
  <a href="CReceipt.dc.html" style="height: 56px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #2A2F8F; color: #FFFFFF; font-size: 18px; font-weight: 700; text-decoration: none">Scan seller's receipt</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
