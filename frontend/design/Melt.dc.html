<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Close vault</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 44px 20px 24px; background: #F2F3EE; color: #14172B; font-family: 'Noto Sans', sans-serif; display: flex; flex-direction: column; gap: 18px">
  <div style="display: flex; align-items: center; gap: 4px; margin-left: -12px">
    <a href="HomeCustomer.dc.html" aria-label="Back" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #14172B"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div style="font-size: 22px; font-weight: 800">Close vault</div>
  </div>
  <sc-if value="{{ask}}" hint-placeholder-val="{{ true }}">
    <div style="font-size: 30px; font-weight: 800; line-height: 1.15">Stop spending from this vault?</div>
    <div style="background: #FFFFFF; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 17px; color: #4A4F66">Unspent</span><span style="font-size: 30px; font-weight: 800">₦8,000</span></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 17px; color: #4A4F66">Still settling</span><span style="font-size: 30px; font-weight: 800">₦2,000</span></div>
    </div>
    <div style="font-size: 18px; font-weight: 500; color: #4A4F66">You cannot sign new payments after this. Sellers holding your vouchers stay protected.</div>
    <div style="flex-grow: 1"></div>
    <button onClick="{{close}}" style="height: 56px; flex: none; border: 0; border-radius: 12px; background: #2A2F8F; color: #FFFFFF; font-family: inherit; font-size: 18px; font-weight: 700">Close vault</button>
  </sc-if>
  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <div style="font-size: 30px; font-weight: 800; line-height: 1.15">Vault closed. Release is scheduled.</div>
    <div style="background: #FFFFFF; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 17px; color: #4A4F66">PayPal releases your hold by</div>
      <div style="font-size: 30px; font-weight: 800">10 Nov, 11:00</div>
      <div style="height: 1px; background: #E1E2DA"></div>
      <div style="font-size: 16px; color: #4A4F66">Waiting for this voucher to settle</div>
      <div style="font-family: 'Noto Sans Mono', monospace; font-size: 15px; font-weight: 500">vch_456</div>
    </div>
    <div style="flex-grow: 1"></div>
    <a href="HomeEmpty.dc.html" style="height: 56px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #2A2F8F; color: #FFFFFF; font-size: 18px; font-weight: 700; text-decoration: none">Done</a>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { closed: false };
  renderVals() {
    return { ask: !this.state.closed, done: this.state.closed, close: () => this.setState({ closed: true }) };
  }
}
</script>
</body>
</html>
