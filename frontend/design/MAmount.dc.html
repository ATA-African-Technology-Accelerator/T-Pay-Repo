<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Merchant enters amount</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 44px 20px 24px; background: #F2F3EE; color: #14172B; font-family: 'Noto Sans', sans-serif; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 4px; margin-left: -12px">
      <a href="HomeMerchant.dc.html" aria-label="Back" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #14172B"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
      <div style="font-size: 22px; font-weight: 800">Collect money</div>
    </div>
    <a href="Speak.dc.html" aria-label="Say the amount" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 24px; background: #E7E8F7; color: #2A2F8F"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3zM19 11a7 7 0 0 1-14 0M12 18v4"></path></svg></a>
  </div>
  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; font-size: 68px; font-weight: 800; letter-spacing: -2px">₦2,000</div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: 80px; gap: 8px">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="12"><button aria-label="{{k.a}}" style="border: 0; border-radius: 12px; background: #FFFFFF; color: #14172B; font-family: inherit; font-size: 30px; font-weight: 700">{{k.t}}</button></sc-for>
  </div>
  <a href="MRequest.dc.html" style="height: 56px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #2A2F8F; color: #FFFFFF; font-size: 18px; font-weight: 700; text-decoration: none">Show to customer</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { keys: ['1','2','3','4','5','6','7','8','9','00','0','⌫'].map((t) => ({ t, a: t === '⌫' ? 'Delete' : t })) };
  }
}
</script>
</body>
</html>
